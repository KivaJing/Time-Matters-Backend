version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  ksqldb:
    image: confluentinc/cp-ksqldb-server:7.5.9
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: "kafka:29092"
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_KSQL_SERVICE_ID: "ksql_service_1"
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: "earliest"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/info"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ksql_deployer:
    build: .
    working_dir: /app
    depends_on:
      ksqldb:
        condition: service_healthy
    command: python ksqldb/deploy_ksql.py ksqldb/ksql_config.json
    volumes:
      - .:/app
    restart: "no"

  ollama_full:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-full-data:/root/.ollama
    ports:
      - "11434:11434"
    runtime: nvidia
    restart: unless-stopped

  ollama_fast:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-fast-data:/root/.ollama
    ports:
      - "11435:11434"
    runtime: nvidia
    restart: unless-stopped

  rule_engine:
    build: .
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
    command: python rule_engine/rule_engine.py
    volumes:
      - .:/app
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      INPUT_TOPIC: risk_state_windows_new
      OUTPUT_TOPIC: semantic_events
      GROUP_ID: rule-engine-v2
      EMIT_SAME_STATE_AFTER_SEC: "30"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  reasoning_scheduler:
    build: .
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
    command: python llm_reasoner/reasoning_scheduler.py
    volumes:
      - .:/app
    environment:
      BOOTSTRAP: kafka:29092
      IN_TOPIC: semantic_events
      OUT_REQUEST_TOPIC: reasoning_requests
      OUT_REASONING_TOPIC: reasoning_events
      OUT_DROPPED_TOPIC: reasoning_dropped_events
      OUT_FAST_REQUEST_TOPIC: fast_reasoning_requests
      GROUP_ID: reasoning-scheduler-v2
      
      COALESCE_SEC: 0.2
      MAX_PENDING: 256
      MAX_PENDING_PER_USER: 3
      USER_COOLDOWN_SEC: 2
      ENABLE_USER_COOLDOWN: "true"

      ENABLE_PRIORITY_FILTER: "true"
      DROP_MEDIUM_WHEN_PENDING_GE: 64
      DROP_LOW_ALWAYS: "true"
      MAX_LLM_REQUESTS_PER_SEC: "3"
      MAX_FAST_LLM_REQUESTS_PER_SEC: "3"
      ENABLE_DROPPED_TOPIC: "true"
      SCHEDULER_VERSION: "v3"

      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  llm_reasoner:
    build: .
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
      ollama_full:
        condition: service_started
    command: python llm_reasoner/llm_reasoner.py
    volumes:
      - .:/app
    environment:
      BOOTSTRAP: kafka:29092
      IN_TOPIC: reasoning_requests
      OUT_TOPIC: reasoning_events
      GROUP_ID: llm-reasoner-v2

      OLLAMA_URL: http://ollama_full:11434/api/chat
      OLLAMA_TAGS_URL: http://ollama_full:11434/api/tags
      MODEL: llama3.2:3b

      TIMEOUT_SEC: 60
      CONNECT_TIMEOUT_SEC: 5
      READ_TIMEOUT_SEC: 60
      OLLAMA_WAIT_RETRIES: 30
      OLLAMA_WAIT_SEC: 2

      MAX_WORKERS: 4
      MAX_INFLIGHT: 8
      MAX_REQUEST_AGE_MS: "15000"

      PROMPT_VERSION: "v5-compact-decision-only"
      SCHEMA_VERSION: "v3"

      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  fast_llm_reasoner:
    build: .
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
    command: python llm_reasoner/fast_llm_reasoner.py
    volumes:
      - .:/app
    environment:
      BOOTSTRAP: kafka:29092
      IN_TOPIC: fast_reasoning_requests
      OUT_TOPIC: reasoning_events
      GROUP_ID: fast-llm-reasoner
      OLLAMA_URL: http://ollama_fast:11434/api/generate
      OLLAMA_TAGS_URL: http://ollama_fast:11434/api/tags
      MODEL: granite3-moe:1b
      TIMEOUT_SEC: "6"
      CONNECT_TIMEOUT_SEC: "1"
      READ_TIMEOUT_SEC: "6"
      MAX_WORKERS: "2"
      MAX_INFLIGHT: "2"
      MAX_REQUEST_AGE_MS: "4000"
      OLLAMA_NUM_PREDICT: "12"
      OLLAMA_NUM_CTX: "128"
      OLLAMA_TEMPERATURE: "0.0"
      OLLAMA_KEEP_ALIVE: "10m"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  intervention_engine:
    build: .
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
    command: python intervention/intervention_engine.py
    volumes:
      - .:/app
    environment:
      BOOTSTRAP: kafka:29092
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  ollama-full-data:
  ollama-fast-data: